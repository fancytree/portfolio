<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eight disconnected tools versus one JobNova workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #ffffff; --ink: #0a0a0a; --rule: #cccccc;
      --accent: #ed5b2b; --panel: #10100f; --lime: #aefd48;
      --sans: 'Inter', system-ui, sans-serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--sans); background: #f3f1ea; color: var(--ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1120px; width: 100%; }
    figure { margin: 0; border: 1px solid var(--rule); border-radius: 16px; background: var(--paper); overflow: hidden; }
    .body { padding: 1.75rem; }
    svg { width: 100%; min-width: 860px; display: block; }
    figcaption { border-top: 1px solid var(--rule); padding: 0.85rem 1.75rem;
                 font-size: 11px; font-weight: 300; line-height: 1.5; color: rgba(10,10,10,0.48); }
  </style>
</head>
<body>
  <div class="frame">
    <figure>
      <div class="body">
      <svg viewBox="0 0 1200 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jn-thesis-title jn-thesis-desc">
        <title id="jn-thesis-title">Eight disconnected tools versus one JobNova workflow</title>
        <desc id="jn-thesis-desc">Comparison diagram. The top row shows the eight separate products a job seeker uses to complete a single application — job boards, resume editor, ChatGPT, Google Docs, ATS checker, application portal, email and a spreadsheet — laid out as eight detached cards with seven manual handoffs between them where context is re-entered by hand. Below, JobNova replaces the whole row with one continuous governed workflow of four stages: Match, Customize, Apply and Track.</desc>
        <defs>
          <marker id="arrow-tangle" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(10,10,10,0.30)"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ed5b2b"/></marker>
          <marker id="arrow-ondark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(255,255,255,0.55)"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- ===== LANE 1 — today's toolchain ===== -->
        <text x="40" y="32" fill="rgba(10,10,10,0.42)" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BEFORE</text>
        <text x="40" y="56" fill="#0a0a0a" font-size="16" font-family="'Inter', sans-serif">One application, eight disconnected tools</text>

        <!-- tangled routing: users bounce, backtrack and return; the crossings are the point -->
        <path d="M 72,160 V 192 Q 72,200 80,200 H 184 Q 192,200 192,192 V 176" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 216,176 V 192 Q 216,200 224,200 H 348 Q 356,200 356,192 V 152" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 388,152 V 224 Q 388,232 380,232 H 248 Q 240,232 240,224 V 176" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 264,176 V 208 Q 264,216 272,216 H 492 Q 500,216 500,208 V 168" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 548,168 V 192 Q 548,200 556,200 H 640 Q 648,200 648,192 V 148" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 680,148 V 256 Q 680,264 672,264 H 428 Q 420,264 420,256 V 152" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 712,148 V 208 Q 712,216 720,216 H 776 Q 784,216 784,208 V 172" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 832,172 V 192 Q 832,200 840,200 H 932 Q 940,200 940,192 V 156" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 988,156 V 208 Q 988,216 996,216 H 1072 Q 1080,216 1080,208 V 180" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>
        <path d="M 1128,180 V 240 Q 1128,248 1120,248 H 128 Q 120,248 120,240 V 160" fill="none" stroke="rgba(10,10,10,0.30)" stroke-width="1" marker-end="url(#arrow-tangle)"/>

        <!-- the eight tools, scattered -->
        <rect x="40" y="80" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="40" y="80" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="52" y="104" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">01</text>
        <text x="52" y="144" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">Job boards</text>
        <rect x="176" y="96" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="176" y="96" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="188" y="120" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">02</text>
        <text x="188" y="160" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">Resume editor</text>
        <rect x="332" y="72" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="332" y="72" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="344" y="96" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">03</text>
        <text x="344" y="136" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">ChatGPT</text>
        <rect x="468" y="88" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="468" y="88" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="480" y="112" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">04</text>
        <text x="480" y="136" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">Google Docs /</text>
        <text x="480" y="152" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">Notion / …</text>
        <rect x="624" y="68" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="624" y="68" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="636" y="92" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">05</text>
        <text x="636" y="132" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">ATS checker</text>
        <rect x="752" y="92" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="752" y="92" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="764" y="116" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">06</text>
        <text x="764" y="140" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">Application</text>
        <text x="764" y="156" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">portal</text>
        <rect x="908" y="76" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="908" y="76" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="920" y="100" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">07</text>
        <text x="920" y="140" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">Email</text>
        <rect x="1048" y="100" width="112" height="80" rx="8" fill="#ffffff"/>
        <rect x="1048" y="100" width="112" height="80" rx="8" fill="#ffffff" stroke="rgba(10,10,10,0.20)" stroke-width="1"/>
        <text x="1060" y="124" fill="rgba(10,10,10,0.34)" font-size="8" font-family="'Geist Mono', monospace">08</text>
        <text x="1060" y="164" fill="rgba(10,10,10,0.68)" font-size="12" font-family="'Inter', sans-serif">Spreadsheet</text>

        <!-- bracket spanning the whole row, labelled once -->
        <line x1="40" y1="280" x2="1160" y2="280" stroke="rgba(237,91,43,0.55)" stroke-width="1"/>
        <line x1="40" y1="280" x2="40" y2="272" stroke="rgba(237,91,43,0.55)" stroke-width="1"/>
        <line x1="1160" y1="280" x2="1160" y2="272" stroke="rgba(237,91,43,0.55)" stroke-width="1"/>
        <rect x="480" y="288" width="240" height="12" rx="2" fill="#ffffff"/>
        <text x="600" y="300" fill="#ed5b2b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTEXT RE-ENTERED AT EVERY HOP</text>

        <!-- ===== LANE 2 — JobNova ===== -->
        <text x="40" y="360" fill="#ed5b2b" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">JOBNOVA</text>
        <text x="40" y="384" fill="#0a0a0a" font-size="16" font-family="'Inter', sans-serif">One continuous, governable workflow</text>

        <rect x="40" y="408" width="1120" height="88" rx="8" fill="#10100f"/>

        <text x="180" y="440" fill="#aefd48" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">01</text>
        <text x="180" y="468" fill="#ffffff" font-size="16" font-family="'Inter', sans-serif" text-anchor="middle">Match</text>

        <line x1="304" y1="452" x2="336" y2="452" stroke="rgba(255,255,255,0.55)" stroke-width="1" marker-end="url(#arrow-ondark)"/>

        <text x="460" y="440" fill="#aefd48" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">02</text>
        <text x="460" y="468" fill="#ffffff" font-size="16" font-family="'Inter', sans-serif" text-anchor="middle">Customize</text>

        <line x1="584" y1="452" x2="616" y2="452" stroke="rgba(255,255,255,0.55)" stroke-width="1" marker-end="url(#arrow-ondark)"/>

        <text x="740" y="440" fill="#aefd48" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">03</text>
        <text x="740" y="468" fill="#ffffff" font-size="16" font-family="'Inter', sans-serif" text-anchor="middle">Apply</text>

        <line x1="864" y1="452" x2="896" y2="452" stroke="rgba(255,255,255,0.55)" stroke-width="1" marker-end="url(#arrow-ondark)"/>

        <text x="1020" y="440" fill="#aefd48" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">04</text>
        <text x="1020" y="468" fill="#ffffff" font-size="16" font-family="'Inter', sans-serif" text-anchor="middle">Track</text>
      </svg>
      </div>
      <figcaption>The product advantage was not another isolated AI feature. It was the orchestration layer connecting discovery, judgment, content, execution, and follow-up.</figcaption>
    </figure>
  </div>
</body>
</html>
