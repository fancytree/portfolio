<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 795" role="img" aria-labelledby="participation-title participation-desc"><title id="participation-title">Code as a design material</title><desc id="participation-desc">Three connected levels compare what can and cannot be established, with a shared band of five checks.</desc><defs><marker id="participation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--case-ink, #171717)"/></marker></defs><rect width="1400" height="795" fill="var(--case-bg, #fff)"/><text x="700" y="64" text-anchor="middle" font-family="var(--case-font-heading, sans-serif)" font-size="40" class="article-diagram-title" font-weight="var(--case-weight-strong, 650)" fill="var(--case-ink, #171717)">Code as a design material</text><text x="700" y="113" text-anchor="middle" font-family="var(--case-font-body, sans-serif)" font-size="23" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">Three levels of participation. Each carries a different scope of responsibility.</text><rect x="36" y="150" width="420" height="368" rx="3" fill="var(--case-bg, #fff)" stroke="var(--case-rule, #b6b6b6)" stroke-width="var(--case-border-width, 1)"/><circle cx="63" cy="185" r="19" fill="var(--case-ink, #171717)" stroke="var(--case-ink, #171717)" stroke-width="1.5"/><text x="63" y="191" text-anchor="middle" font-family="var(--case-font-body, sans-serif)" font-size="17" font-weight="var(--case-weight-strong, 650)" fill="#fff">1</text><text x="93" y="194" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="27" font-weight="var(--case-weight-strong, 650)" fill="var(--case-ink, #171717)">Build</text><text x="56" y="229" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="20" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">Make an idea into</text><text x="56" y="254" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="20" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">an interactive demo</text><path d="M 36 280 H 456" fill="none" stroke="var(--case-rule, #b6b6b6)" stroke-width="1" stroke-dasharray="var(--case-space-6, 6) var(--case-space-4, 4)"/><path d="M 246 280 V 518" fill="none" stroke="var(--case-rule, #b6b6b6)" stroke-width="1" stroke-dasharray="var(--case-space-6, 6) var(--case-space-4, 4)"/><text x="56" y="314" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="19" font-weight="var(--case-weight-strong, 650)" fill="var(--case-copy, #444)">Can demonstrate</text><text x="262" y="314" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="19" font-weight="var(--case-weight-strong, 650)" fill="var(--case-ink, #171717)">Cannot establish</text><text x="56" y="352" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="18" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">Usable interactions</text><text x="56" y="379" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="18" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">Core flow runs</text><text x="56" y="406" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="18" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">Key states are visible</text><text x="262" y="352" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="18" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">Performance and</text><text x="262" y="379" text-anchor="start" font-family="var(--case-font-body, sans-serif)" font-size="18" font-weight="var(--case-weight-regular, 400)" fill="var(--case-ink, #171717)">stability</text><text x="262" y="406" text-anchor="start" font-family="var(--case-font-body, sans-serif