<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 795" role="img" aria-labelledby="participation-title participation-desc"><title id="participation-title">Code as a design material</title><desc id="participation-desc">Three connected levels compare what can and cannot be established, with a shared band of five checks.</desc><defs><marker id="participation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#242522"/></marker></defs><rect width="1400" height="795" fill="#fbf8ee"/><text x="700" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="45" font-weight="700" fill="#242522">Code as a design material</text><text x="700" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#242522">Three levels of participation. Each carries a different scope of responsibility.</text><rect x="36" y="150" width="420" height="368" rx="3" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="63" cy="185" r="19" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="63" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">1</text><text x="93" y="194" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242522">Build</text><text x="56" y="229" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#242522">Make an idea into</text><text x="56" y="254" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#242522">an interactive demo</text><path d="M 36 280 H 456" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><path d="M 246 280 V 518" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><text x="56" y="314" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a53527">Can demonstrate</text><text x="262" y="314" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242522">Cannot establish</text><text x="56" y="352" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Usable interactions</text><text x="56" y="379" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Core flow runs</text><text x="56" y="406" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Key states are visible</text><text x="262" y="352" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Performance and</text><text x="262" y="379" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">stability</text><text x="262" y="406" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Security and access</text><text x="262" y="433" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Scalability and</text><text x="262" y="460" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">maintainability</text><path d="M 460 211 H 485" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#participation-arrow)"/><rect x="490" y="150" width="420" height="368" rx="3" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="517" cy="185" r="19" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="517" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">2</text><text x="547" y="194" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242522">Inspect &amp; modify</text><text x="510" y="229" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#242522">Read the structure, diagnose an</text><text x="510" y="254" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#242522">issue, verify a scoped change</text><path d="M 490 280 H 910" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><path d="M 700 280 V 518" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><text x="510" y="314" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a53527">Can demonstrate</text><text x="716" y="314" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242522">Cannot establish</text><text x="510" y="352" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Issue identified</text><text x="510" y="379" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Change works</text><text x="510" y="406" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">No regressions</text><text x="510" y="433" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">in tested cases</text><text x="716" y="352" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Root cause fully</text><text x="716" y="379" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">eliminated</text><text x="716" y="406" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">System-wide impact</text><text x="716" y="433" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Long-term quality</text><path d="M 914 211 H 939" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#participation-arrow)"/><rect x="944" y="150" width="420" height="368" rx="3" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="971" cy="185" r="19" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="971" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">3</text><text x="1001" y="194" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242522">Deliver together</text><text x="964" y="229" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#242522">Contribute to versions, reviews,</text><text x="964" y="254" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#242522">tests and handoff within scope</text><path d="M 944 280 H 1364" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><path d="M 1154 280 V 518" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><text x="964" y="314" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a53527">Can demonstrate</text><text x="1170" y="314" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242522">Cannot establish</text><text x="964" y="352" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Changes recorded</text><text x="964" y="379" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Reviews documented</text><text x="964" y="406" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Tests backed by</text><text x="964" y="433" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">evidence</text><text x="964" y="460" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Handoff traceable</text><text x="1170" y="352" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Final ownership of</text><text x="1170" y="379" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">decisions and scope</text><text x="1170" y="406" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Systemic risk</text><text x="1170" y="433" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">Final responsibility</text><text x="1170" y="460" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#242522">for delivery</text><rect x="36" y="550" width="1328" height="113" rx="3" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="54" y="578" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#a53527">CHECK THROUGHOUT</text><text x="53" y="611" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242522">Real states</text><text x="53" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#242522">Data and UI agree</text><text x="318" y="611" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242522">Errors</text><text x="318" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#242522">Visible and recoverable</text><path d="M 306 591 V 650" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><text x="583" y="611" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242522">Permissions</text><text x="583" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#242522">Least privilege</text><path d="M 571 591 V 650" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><text x="848" y="611" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242522">Responsive layout</text><text x="848" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#242522">Works across screens</text><path d="M 836 591 V 650" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><text x="1113" y="611" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242522">Accessibility</text><text x="1113" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#242522">Keyboard and semantics</text><path d="M 1101 591 V 650" fill="none" stroke="#aaa79d" stroke-width="1" stroke-dasharray="6 5"/><rect x="36" y="691" width="1328" height="75" rx="3" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="63" y="737" text-anchor="start" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#242522">Runnable ≠ ready to ship</text><path d="M 600 707 V 750" fill="none" stroke="#aaa79d" stroke-width="1"/><text x="628" y="737" text-anchor="start" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#242522">Engineering accountability stays with the engineering team</text></svg>
