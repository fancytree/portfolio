<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 770" role="img" aria-labelledby="capability-title capability-desc"><title id="capability-title">From individual prototypes to team delivery</title><desc id="capability-desc">Four forms of evidence connect personal experiments to team delivery, supported by shared facts and a record of key AI contributions.</desc><defs><marker id="capability-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#242522"/></marker></defs><rect width="1400" height="770" fill="#fbf8ee"/><text x="700" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="45" font-weight="700" fill="#242522">From individual prototypes to team delivery</text><text x="35" y="140" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a53527">Shared facts</text><rect x="170" y="111" width="176" height="48" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><g aria-hidden="true" transform="translate(185 127) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4 1 8l4 4m6-8 4 4-4 4M9.5 2l-3 12"/></g><text x="212" y="141" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#242522">Code</text><rect x="365" y="111" width="176" height="48" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><g aria-hidden="true" transform="translate(380 127) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h6l3 3V15H4z M10 1.5v3h3 M6 8h5m-5 3h5"/></g><text x="407" y="141" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#242522">Spec</text><rect x="560" y="111" width="176" height="48" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><g aria-hidden="true" transform="translate(575 127) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h5v5H2zm7 0h5v5H9zM2 9h5v5H2zm7 0h5v5H9z"/></g><text x="602" y="141" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#242522">Design system</text><rect x="755" y="111" width="176" height="48" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><g aria-hidden="true" transform="translate(770 127) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a4 4 0 0 1 8 0v2 M2.5 7h11v8h-11z M8 10v2"/></g><text x="797" y="141" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#242522">Permissions</text><rect x="950" y="111" width="176" height="48" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><g aria-hidden="true" transform="translate(965 127) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8v6H2V3h8 M5 7l3 3 6-7"/></g><text x="992" y="141" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#242522">Tests and sign-off</text><path d="M155 174 H1142" fill="none" stroke="#aaa79d" stroke-width="1"/><rect x="65" y="385" width="237" height="225" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="183" cy="409" r="15" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="183" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">1</text><text x="183" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#242522">Runnable prototype</text><text x="183" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">A hypothesis can be tried</text><path d="M65 503 H302" fill="none" stroke="#aaa79d" stroke-width="1"/><text x="80" y="532" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Quick validation</text><text x="80" y="558" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Minimum working flow</text><text x="80" y="584" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Feedback from use</text><text x="183" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Individual exploration</text><path d="M302 412 H317 V353 H333" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#capability-arrow)"/><rect x="335" y="326" width="237" height="284" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="453" cy="350" r="15" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="453" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">2</text><text x="453" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#242522">Spec + version history</text><text x="453" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Scope and changes are traceable</text><path d="M335 444 H572" fill="none" stroke="#aaa79d" stroke-width="1"/><text x="350" y="473" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Clear requirements</text><text x="350" y="499" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Reviewable versions</text><text x="350" y="525" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Traceable changes</text><text x="453" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Documented practice</text><path d="M572 353 H587 V294 H603" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#capability-arrow)"/><rect x="605" y="267" width="237" height="343" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="723" cy="291" r="15" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="723" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">3</text><text x="723" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#242522">Validated methods</text><text x="723" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Others can reuse the approach</text><path d="M605 385 H842" fill="none" stroke="#aaa79d" stroke-width="1"/><text x="620" y="414" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Test across tasks</text><text x="620" y="440" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Record the method</text><text x="620" y="466" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Reuse skills and templates</text><text x="620" y="492" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Update the design system</text><text x="723" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Reusable methods</text><path d="M842 294 H857 V235 H873" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#capability-arrow)"/><rect x="875" y="208" width="237" height="402" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="993" cy="232" r="15" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="993" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">4</text><text x="993" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#242522">Review + runtime results</text><text x="993" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">A defined scope is ready to ship</text><path d="M875 326 H1112" fill="none" stroke="#aaa79d" stroke-width="1"/><text x="890" y="355" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Cross-functional review</text><text x="890" y="381" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Verified runtime outcomes</text><text x="890" y="407" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">• Authorized release scope</text><text x="993" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Team delivery</text><rect x="1152" y="111" width="211" height="499" rx="5" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="1257" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#242522">Key AI contributions</text><circle cx="1173" cy="186" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="1173" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">1</text><g aria-hidden="true" transform="translate(1194 178) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h6l3 3V15H4z M10 1.5v3h3 M6 8h5m-5 3h5"/></g><text x="1218" y="191" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Input sources</text><path d="M1165 215 H1350" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="1173" cy="254" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="1173" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">2</text><g aria-hidden="true" transform="translate(1194 246) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="m8 1 2.1 4.5 4.9.6-3.6 3.4.9 4.9L8 12l-4.3 2.4.9-4.9L1 6.1l4.9-.6z"/></g><text x="1218" y="259" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Generated work</text><path d="M1165 283 H1350" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="1173" cy="322" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="1173" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">3</text><g aria-hidden="true" transform="translate(1194 314) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M2 15c0-6 12-6 12 0"/></g><text x="1218" y="327" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Human decisions</text><path d="M1165 351 H1350" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="1173" cy="390" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="1173" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">4</text><g aria-hidden="true" transform="translate(1194 382) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4 1 8l4 4m6-8 4 4-4 4M9.5 2l-3 12"/></g><text x="1218" y="395" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Automated tests</text><path d="M1165 419 H1350" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="1173" cy="458" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="1173" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">5</text><g aria-hidden="true" transform="translate(1194 450) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8v6H2V3h8 M5 7l3 3 6-7"/></g><text x="1218" y="463" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Human acceptance</text><path d="M1165 487 H1350" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="1173" cy="526" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="1173" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">6</text><g aria-hidden="true" transform="translate(1194 518) scale(1)" fill="none" stroke="#242522" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5 15 14H1L8 1.5z M8 6v3m0 2.5v.2"/></g><text x="1218" y="531" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Known limits</text><rect x="35" y="681" width="1328" height="61" rx="4" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="700" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#242522">Teams can share the work. Decision authority stays explicit.</text></svg>
