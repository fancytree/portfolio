<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 755" role="img" aria-labelledby="delivery-title delivery-desc"><title id="delivery-title">Three artifacts for runnable delivery</title><desc id="delivery-desc">Roles and consequences, context and permissions converge into a maintained spec that guides code, interfaces, testing and acceptance.</desc><defs><marker id="delivery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#242522"/></marker></defs><rect width="1400" height="755" fill="#fbf8ee"/><text x="700" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="45" font-weight="700" fill="#242522">Three artifacts for runnable delivery</text><rect x="40" y="105" width="426" height="306" rx="6" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="69" cy="137" r="15" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="69" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">1</text><text x="95" y="145" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#242522">Roles and consequences</text><path d="M 52 161 H 454" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="67" cy="185" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="67" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">1</text><text x="88" y="191" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Execution</text><text x="227" y="191" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Who does the work?</text><circle cx="67" cy="216" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="67" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">2</text><text x="88" y="222" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Judgment</text><text x="227" y="222" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Who makes the call?</text><circle cx="67" cy="247" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="67" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">3</text><text x="88" y="253" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Approval</text><text x="227" y="253" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Who can authorize it?</text><circle cx="67" cy="278" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="67" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">4</text><text x="88" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Affected parties</text><text x="227" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Who is impacted?</text><circle cx="67" cy="309" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="67" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">5</text><text x="88" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Consequences</text><text x="227" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Who responds and how?</text><rect x="487" y="105" width="426" height="306" rx="6" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="516" cy="137" r="15" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="516" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">2</text><text x="542" y="145" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#242522">Context map</text><path d="M 499 161 H 901" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="514" cy="185" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="514" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">1</text><text x="535" y="191" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Source</text><text x="674" y="191" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Where does it come from?</text><circle cx="514" cy="216" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="514" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">2</text><text x="535" y="222" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Purpose</text><text x="674" y="222" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">What is it used for?</text><circle cx="514" cy="247" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="514" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">3</text><text x="535" y="253" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Reliability</text><text x="674" y="253" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">How trustworthy is it?</text><circle cx="514" cy="278" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="514" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">4</text><text x="535" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Freshness</text><text x="674" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">When was it updated?</text><circle cx="514" cy="309" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="514" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">5</text><text x="535" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Sensitivity</text><text x="674" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">How is it classified?</text><circle cx="514" cy="340" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="514" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">6</text><text x="535" y="346" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Maintainer</text><text x="674" y="346" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Who keeps it current?</text><rect x="934" y="105" width="426" height="306" rx="6" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><circle cx="963" cy="137" r="15" fill="#a53527" stroke="#a53527" stroke-width="1.5"/><text x="963" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">3</text><text x="989" y="145" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#242522">Permission model</text><path d="M 946 161 H 1348" fill="none" stroke="#aaa79d" stroke-width="1"/><circle cx="961" cy="185" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="961" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">1</text><text x="982" y="191" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Read / write</text><text x="1121" y="191" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">What can it access or change?</text><circle cx="961" cy="216" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="961" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">2</text><text x="982" y="222" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Tools</text><text x="1121" y="222" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Which tools are allowed?</text><circle cx="961" cy="247" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="961" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">3</text><text x="982" y="253" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Environment</text><text x="1121" y="253" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Where may it operate?</text><circle cx="961" cy="278" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="961" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">4</text><text x="982" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Risk</text><text x="1121" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">What could go wrong?</text><circle cx="961" cy="309" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="961" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">5</text><text x="982" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Revocation</text><text x="1121" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">How can access be removed?</text><circle cx="961" cy="340" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="961" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">6</text><text x="982" y="346" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Scope of impact</text><text x="1121" y="346" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Who or what could be affected?</text><circle cx="961" cy="371" r="10" fill="#fbf8ee" stroke="#a53527" stroke-width="1.5"/><text x="961" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a53527">7</text><text x="982" y="377" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#242522">Confirmation</text><text x="1121" y="377" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">When is approval required?</text><path d="M253 411 V445 H590 V467" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#delivery-arrow)"/><path d="M700 411 V467" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#delivery-arrow)"/><path d="M1147 411 V445 H810 V467" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#delivery-arrow)"/><rect x="535" y="469" width="330" height="80" rx="6" fill="#fbf8ee" stroke="#a53527" stroke-width="1.6"/><text x="700" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#a53527">Spec</text><text x="700" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#242522">The team’s current, maintained agreement</text><path d="M700 549 V576 M180 576 H1220" fill="none" stroke="#242522" stroke-width="2"/><path d="M180 576 V605" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#delivery-arrow)"/><rect x="58" y="606" width="244" height="57" rx="5" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="180" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242522">Code</text><text x="180" y="651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Implementation</text><path d="M527 576 V605" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#delivery-arrow)"/><rect x="405" y="606" width="244" height="57" rx="5" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="527" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242522">Interfaces</text><text x="527" y="651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Integration</text><path d="M873 576 V605" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#delivery-arrow)"/><rect x="751" y="606" width="244" height="57" rx="5" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="873" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242522">Tests</text><text x="873" y="651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Verification</text><path d="M1220 576 V605" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#delivery-arrow)"/><rect x="1098" y="606" width="244" height="57" rx="5" fill="#fbf8ee" stroke="#242522" stroke-width="1.6"/><text x="1220" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242522">Acceptance</text><text x="1220" y="651" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#242522">Release decision</text><path d="M40 694 H1360" fill="none" stroke="#aaa79d" stroke-width="1"/><text x="700" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242522">Link each object to its version and the decisions that affect it.</text></svg>
