<style>
  :root { --ink:#1c1a16; --sub:#7b7463; --line:#d8cfba; --brand:#1c1a16; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; }
  .panel { box-sizing:border-box; position:absolute; top:12px; width:264px; max-height:calc(100% - 24px); overflow:auto;
    background:rgba(251,248,240,.52); -webkit-backdrop-filter:blur(24px) saturate(1.6); backdrop-filter:blur(24px) saturate(1.6); border:1px solid rgba(251,248,240,.7); border-radius:16px; padding:14px;
    box-shadow:0 4px 20px rgba(40,32,20,.18); font-size:13px; }
  #left { left:12px; transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .2s, visibility 0s; }
  #left.collapsed { transform:translateX(calc(-100% - 24px)); opacity:0; visibility:hidden; pointer-events:none; transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .2s, visibility 0s .28s; }
  .phead { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }

  .pcollapse { width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:8px; background:transparent; color:var(--sub); }
  .pcollapse:hover { background:#e4dccb; color:var(--ink); }
  .pcollapse .ic { width:17px; height:17px; margin:0; }
  /* 左面板收起后,左上角留一个小的展开按钮 */
  #left-open { position:absolute; top:12px; left:12px; z-index:4; display:none; align-items:center; gap:7px; padding:9px 13px 9px 11px; border-radius:12px; background:rgba(251,248,240,.55); -webkit-backdrop-filter:blur(24px) saturate(1.6); backdrop-filter:blur(24px) saturate(1.6); border:1px solid rgba(251,248,240,.7); box-shadow:0 4px 20px rgba(40,32,20,.18); font-size:13px; font-weight:600; color:var(--ink); }
  #left-open .ic { width:17px; height:17px; margin:0; color:var(--brand); }

  body.left-collapsed #left-open { display:flex; animation:lo-in .25s ease-out; }

  #right { right:12px; width:292px; max-height:calc(100% - 24px - 172px); }   /* 给右下角的比例尺和缩放按钮留出位置 */
  h1 { font-size:15px; margin:0 0 2px; }
  .sub { font-size:11.5px; color:var(--sub); margin:0 0 6px; line-height:1.5; }

  label.opt { display:flex; align-items:center; gap:7px; margin:5px 0; cursor:pointer; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .cnt { margin-left:auto; color:var(--sub); font-size:11.5px; font-variant-numeric:tabular-nums; }
  button { font:inherit; font-size:12.5px; border:0; border-radius:8px; background:#f1ecdf; cursor:pointer; padding:7px 10px; }
  button:hover { background:#e4dccb; }
  button.on { background:var(--brand); color:#f6f1e5; }
  .places button { display:block; width:100%; text-align:left; margin:3px 0; }
  .row { display:flex; gap:6px; margin-top:6px; } .row button { flex:1; text-align:center; }
  .tiny { font-size:11px; color:var(--sub); line-height:1.55; }
  .sl { margin:6px 0 9px; } .sl .t { display:flex; justify-content:space-between; }
  .sl .d { font-size:11px; color:var(--sub); } .sl input { width:100%; margin:2px 0 0; }
  .top { display:flex; gap:9px; padding:8px 9px; margin:5px 0; border-radius:10px; background:#f1ecdf; cursor:pointer; }
  .top:hover { background:#e4dccb; }
  .rk { width:22px; height:22px; border-radius:50%; background:#1c1a16; color:#f6f1e5; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; font-size:12px; }
  .top b { display:block; font-size:12.5px; } .top span { font-size:11px; color:var(--sub); line-height:1.5; }
  .sc { margin-left:auto; font-size:17px; font-weight:700; color:#1c1a16; align-self:center; }
  /* 底部中间的 dock:位于左右面板之间,不压住它们;子元素才接收鼠标,其余区域点击穿透到地图 */
  #dock { position:absolute; z-index:3; bottom:26px; left:22px; right:84px; display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:none; }
  /* 推荐条铺满整个底部(右侧留出缩放按钮);显示时,两个面板的高度相应缩短,不被它压住 */
  body.has-dock #left { max-height:calc(100% - 24px - 160px); }
  body.has-dock #right { max-height:calc(100% - 24px - 172px); }
  #dock > * { pointer-events:auto; }
  #legend-wrap { position:absolute; z-index:3; top:12px; left:calc(12px + 264px + 12px); right:calc(12px + 292px + 12px); display:flex; justify-content:center; pointer-events:none; transition:left .28s cubic-bezier(.4,0,.2,1); }
  body.left-collapsed #legend-wrap { left:calc(12px + 100px + 12px); }
  #legend-wrap > * { pointer-events:auto; }
  #legend-wrap { transition:left .28s cubic-bezier(.4,0,.2,1), opacity .2s; }
  body:has(.maplibregl-popup:not(.hv-pop)) #legend-wrap { opacity:0; pointer-events:none; }   /* 有信息卡片时,顶部图例淡出,避免盖住卡片 */
  #top3-bar { display:none; width:100%; flex-direction:column; align-items:center; gap:6px; }
  .t3-title { font-size:11px; font-weight:600; letter-spacing:.06em; color:#f6f1e5; background:rgba(40,32,20,.72); padding:2px 10px; border-radius:10px; backdrop-filter:blur(4px); }
  #top3-wrap { position:relative; width:100%; }
  #top3 { display:flex; gap:8px; width:100%; overflow-x:auto; overflow-y:hidden; padding:10px 20px 28px; margin:-10px -20px -28px; width:calc(100% + 40px); scroll-padding:0 20px; scroll-snap-type:x proximity; scrollbar-width:none; scroll-behavior:smooth; }
  #top3::-webkit-scrollbar { display:none; }
  .t3-nav { position:absolute; top:50%; transform:translateY(-50%); z-index:2; width:28px; height:28px; border-radius:50%; border:0; background:#1c1a16; color:#f6f1e5; font-size:18px; line-height:26px; padding:0; box-shadow:0 2px 8px rgba(40,32,20,.35); cursor:pointer; }
  .t3-nav.prev { left:-10px; } .t3-nav.next { right:-10px; }
  .t3-nav:disabled { opacity:0; pointer-events:none; }
  .t3 { flex:0 0 clamp(158px, calc((100% - 40px) / 6), 190px); min-width:0; margin:0; scroll-snap-align:start; background:rgba(251,248,240,.97); border:1px solid #e4dccb; border-radius:12px; padding:9px 11px; box-shadow:0 1px 2px rgba(40,32,20,.06), 0 6px 20px -4px rgba(40,32,20,.14); cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .t3:hover { transform:translateY(-2px); box-shadow:0 1px 2px rgba(40,32,20,.06), 0 12px 26px -6px rgba(40,32,20,.18); }
  .t3 .h { display:flex; align-items:center; gap:7px; }
  .t3 .rk { width:20px; height:20px; font-size:11px; }
  .t3 { position:relative; }
  .t3.sel { border-color:#1c1a16; background:linear-gradient(180deg,#fbf8f0,#f1ecdf); transform:translateY(-4px); box-shadow:0 0 0 2px #1c1a16, 0 12px 26px -6px rgba(40,32,20,.22); }
  .t3.sel .rk { box-shadow:0 0 0 3px rgba(40,32,20,.18); }
  .t3.sel .sc { color:#1c1a16; }
  .t3:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .t3 .h { align-items:flex-start; }
  .t3 .rk { margin-top:1px; flex:none; }
  .t3 .h b { flex:1; min-width:0; font-size:12.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .t3 .m { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:6px; padding-top:6px; border-top:1px solid #e4dccb; }
  .t3 .sc { margin:0; font-size:20px; line-height:1; font-weight:700; color:#1c1a16; font-variant-numeric:tabular-nums; }
  .t3 .sc { font-size:22px; }
  .t3 .x { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:7px; padding-top:7px; border-top:1px solid #e4dccb; }
  .t3 .x i { display:block; font-style:normal; font-size:10px; color:var(--sub); }
  .t3 .x b { font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
  .t3 .fb { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:7px; }
  .t3 .fb small { display:flex; justify-content:space-between; gap:3px; white-space:nowrap; font-size:9.5px; color:var(--sub); font-variant-numeric:tabular-nums; }
  .t3 .fb small b { color:var(--ink); font-weight:600; }
  .t3 .fb u { display:block; height:3px; margin-top:2px; border-radius:2px; text-decoration:none; background:linear-gradient(90deg, var(--c) var(--v), rgba(40,32,20,.10) var(--v)); }
  .t3 .m span { font-size:10.5px; line-height:1.45; color:var(--sub); text-align:right; white-space:nowrap; }
  #legend { background:rgba(251,248,240,.93);
    padding:7px 12px; border-radius:8px; font-size:11px; box-shadow:0 2px 10px rgba(40,32,20,.15); display:none; }
  #legend .bar { width:220px; height:8px; border-radius:4px; margin:4px 0 2px; }
  #legend .ends { display:flex; justify-content:space-between; color:var(--sub); }
  /* 弹窗:去掉默认内边距,自己排版 */
  .maplibregl-popup-content { padding:0; border-radius:14px; overflow:hidden; font-size:12.5px; line-height:1.5; color:var(--ink); box-shadow:0 14px 38px rgba(40,32,20,.3), 0 2px 6px rgba(40,32,20,.1); }
  .maplibregl-popup-close-button { top:9px; right:9px; width:24px; height:24px; padding:0; border-radius:50%; font-size:16px; line-height:23px; color:#d8cfba; background:rgba(251,248,240,.14); z-index:2; }
  .maplibregl-popup-close-button:hover { background:rgba(251,248,240,.26); color:#f6f1e5; }
  .maplibregl-popup-close-button:focus { outline:none; } .maplibregl-popup-close-button:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  .pp { padding:0; min-width:150px; }
  .pp-h { padding:11px 40px 10px 14px; background:#1c1a16; color:#f6f1e5; font-size:13.5px; font-weight:700; line-height:1.3; }
  .pp-b { padding:9px 14px 11px; color:#4b463b; }
  .lm-pop .pp { width:260px; }
  .lm-img { display:block; width:100%; height:150px; object-fit:cover; background:#e4dccb; }
  .lm-media { position:relative; }
  .lm-h { position:absolute; left:0; right:0; top:0; padding:12px 44px 34px 14px; color:#f6f1e5; font-size:14px; font-weight:700; line-height:1.3; background:linear-gradient(180deg, rgba(20,16,10,.72) 0%, rgba(20,16,10,.38) 55%, rgba(20,16,10,0) 100%); text-shadow:0 1px 3px rgba(0,0,0,.35); }   /* 标题压在照片上,用黑色透明渐变托底,不再有一条黑边 */
  .lm-t { padding:10px 14px 12px; color:#4b463b; }
  /* 弹窗「长出来」:以指向地点的小三角为原点,从小到大、略带回弹地升起;原点跟随弹窗的锚点方向 */
  .maplibregl-popup-content { transform-origin:50% calc(100% + 10px); animation:pop-grow .46s cubic-bezier(.2,.9,.28,1.2) both; }
  .maplibregl-popup-anchor-bottom-left .maplibregl-popup-content { transform-origin:16px calc(100% + 14px); }
  .maplibregl-popup-anchor-bottom-right .maplibregl-popup-content { transform-origin:calc(100% - 16px) calc(100% + 14px); }
  .maplibregl-popup-anchor-top .maplibregl-popup-content, .maplibregl-popup-anchor-top-left .maplibregl-popup-content, .maplibregl-popup-anchor-top-right .maplibregl-popup-content { transform-origin:50% -14px; }
  .maplibregl-popup-anchor-left .maplibregl-popup-content { transform-origin:-14px 50%; }
  .maplibregl-popup-anchor-right .maplibregl-popup-content { transform-origin:calc(100% + 14px) 50%; }
  .maplibregl-popup-tip { transform-origin:50% 100%; animation:pop-grow .46s cubic-bezier(.2,.9,.28,1.2) both; }   /* 尖角和卡片同一个动画、同一个原点(尖角底端),是一个整体 */
  @keyframes pop-grow { 0% { opacity:0; transform:scale(.3); } 55% { opacity:1; } 100% { opacity:1; transform:none; } }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip, .maplibregl-popup-anchor-top-left .maplibregl-popup-tip, .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { transform-origin:50% 0; }
  .maplibregl-popup-anchor-left .maplibregl-popup-tip { transform-origin:0 50%; } .maplibregl-popup-anchor-right .maplibregl-popup-tip { transform-origin:100% 50%; }
  @keyframes tip-in { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:none; } }
  .ac-bar .tr i { transform-origin:left center; animation:bar-grow .7s cubic-bezier(.2,.8,.2,1) .28s both; }
  .ac-bar:nth-child(3) .tr i { animation-delay:.34s; } .ac-bar:nth-child(4) .tr i { animation-delay:.4s; } .ac-bar:nth-child(5) .tr i { animation-delay:.46s; }
  @keyframes bar-grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .maplibregl-popup-content, .maplibregl-popup-tip, .ac-bar .tr i { animation:none !important; } }
  .ac { width:272px; }
  .ac-title { padding:15px 42px 0 16px; background:#1c1a16; color:#f6f1e5; }
  .ac-title b { display:block; font-size:16px; line-height:1.25; font-weight:700; letter-spacing:-.01em; }
  .ac-title span { display:block; margin-top:2px; font-size:11px; color:#a69f8c; line-height:1.4; }
  .ac-hero { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 15px 14px; background:#1c1a16; }
  .ac-score { display:flex; align-items:baseline; gap:6px; }
  .ac-score em { font-style:normal; font-size:38px; line-height:1; font-weight:800; letter-spacing:-.03em; color:var(--t); font-variant-numeric:tabular-nums; }
  .ac-score small { font-size:11px; color:#a69f8c; }

  .ac-badge i { font-style:normal; font-weight:500; opacity:.7; }

  .ac-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#e4dccb; border-top:1px solid #e4dccb; border-bottom:1px solid #e4dccb; }
  .ac-grid > div { background:#fbf8f0; padding:8px 11px 9px; }
  .ac-grid i { display:block; font-style:normal; font-size:10.5px; color:#7b7463; }
  .ac-grid b { display:block; margin-top:1px; font-size:14.5px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }

  .rc { width:304px; }

  .ac-grid.c2 { grid-template-columns:1fr 1fr; } .ac-grid.c4 { grid-template-columns:repeat(4,1fr); }
  .rc-ttl { padding:11px 15px 0; font-size:11px; font-weight:700; color:#4b463b; } .rc-ttl small { margin-left:6px; font-weight:400; color:#a69f8c; }

  .rc-t i { width:9px; height:9px; border-radius:50%; flex:none; }
  .rc-t span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rc-t b { font-variant-numeric:tabular-nums; color:#1c1a16; }
  .ac-bars { display:grid; gap:8px; padding:11px 15px 14px; }
  .ac-bt { font-size:11px; font-weight:700; color:#4b463b; } .ac-bt small { margin-left:6px; font-weight:400; color:#a69f8c; }
  .ac-bar { display:grid; grid-template-columns:64px 1fr 22px; align-items:center; gap:9px; font-size:11.5px; color:#4b463b; }
  .ac-bar .tr { height:6px; border-radius:3px; background:#e4dccb; overflow:hidden; }
  .ac-bar .tr i { display:block; height:100%; border-radius:3px; background:var(--c); }
  .ac-bar b { text-align:right; font-variant-numeric:tabular-nums; color:#1c1a16; }
  /* 点亮区域后,咖啡店卡片里的范围提示条 */
  #scope { margin:8px 0 0; }
  .scope-chip { display:flex; align-items:center; gap:7px; padding:6px 6px 6px 10px; border-radius:9px; background:#f1ecdf; border:1px solid #d8cfba; color:#4b463b; font-size:12px; }

  .scope-x:hover { background:rgba(40,32,20,.10); } .scope-x .ic { width:13px; height:13px; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#fbf8f0; z-index:9; color:var(--sub); }
  #score-box { display:none; }

  #draw-btn.on { background:var(--brand); color:#f6f1e5; }

  .city-pop { display:none; position:fixed; z-index:60; min-width:260px; flex-direction:column; background:#fbf8f0; border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 36px rgba(40,32,20,.24), 0 2px 6px rgba(40,32,20,.08); overflow:hidden; font-size:13px; color:var(--ink); }

  });
  document.addEventListener("mousedown", e => { if (!root.contains(e.target) && !pop.contains(e.target) && isOpen()) collapse(); });
  collapse();
}

function buildPickers() {
  createPicker($("city"), { items:CITIES, current:curCity, icon:"pin", group:c => c.country, placeholder:"Search for a city…", editTitle:"Edit city",
    hint:"More cities coming soon", empty:"No cities found", locked:c => `${c.zh} isn't available yet. Only Milan is supported for now.`,
    onPick:c => { curCity = c; applyCity(c); map.flyTo({ center:c.c, zoom:14.3, pitch:flatMode ? 0 : 60, bearing:flatMode ? 0 : 20, duration:2500 }); } });
  createPicker($("shop"), { items:SHOPS, current:curShop, icon:"coffee", group:c => c.group, placeholder:"Search for a shop type…", combo:true,
    empty:"No shop types found", locked:c => `${c.zh} isn't available yet. Only coffee shops are supported for now.`, liveText:"Available",
    onPick:c => { curShop = c; } });
}

// 左面板收起 / 展开(记住你的选择)
function setLeftCollapsed(c, persist = true) {
  $("left").classList.toggle("collapsed", c); document.body.classList.toggle("left-collapsed", c);
  $("left").setAttribute("aria-hidden", c ? "true" : "false");
  if (persist) { try { localStorage.setItem("leftCollapsed", c ? "1" : "0"); } catch (e) {} }
  if (typeof queuePlace === "function") { queuePlace(); setTimeout(queuePlace, 320); }     // 安全区变了,卡片重新定位     // 自动收起只是临时的,不改变你保存的偏好
}
// 开始操作右侧面板(点选项、拖滑块、输入搜索)→ 自动收起左面板,把地图腾出来。
// 防打架:手动把左面板展开后,不会因为接着点右边又被收起,直到你重新操作过左面板。
let autoCollapseOK = true;
function initAutoCollapse() {
  const interactive = "button, input, select, textarea, label, a, [role=button], [role=option], .city-box";
  $("right").addEventListener("pointerdown", e => {
    if (!e.target.closest(interactive) || !autoCollapseOK || $("left").classList.contains("collapsed")) return;     // 只有点到控件才算「开始编辑」,单纯滚动面板不算
    setLeftCollapsed(true, false);
  });
  $("right").addEventListener("input", () => { if (autoCollapseOK && !$("left").classList.contains("collapsed")) setLeftCollapsed(true, false); });   // 键盘调滑块、打字搜索
  $("left").addEventListener("pointerdown", () => { autoCollapseOK = true; });                                  // 重新操作左面板 → 恢复自动收起
  document.querySelectorAll(".city-pop").forEach(p => p.addEventListener("pointerdown", () => { /* 弹层属于各自的面板,无需处理 */ }));
}
function buildUI() {
  $("left-collapse").onclick = () => setLeftCollapsed(true);
  $("left-open").onclick = () => { autoCollapseOK = false; setLeftCollapsed(false); };     // 手动展开 → 暂时不再自动收起
  initAutoCollapse();
  let savedCollapsed = false; try { savedCollapsed = localStorage.getItem("leftCollapsed") === "1"; } catch (e) {}
  setLeftCollapsed(savedCollapsed);
  buildPickers();
  // 区域着色
  document.querySelectorAll("#shade-toggle button").forEach(b => b.onclick = () => { if (shade !== b.dataset.s) setShade(b.dataset.s); });   // 无 / 选址评分 / 人口密度,有且仅有一项选中
  // 图层
  const cnt = k => FP.filter(f=>f.k===k).length;
  $("n-metro").textContent = DATA.metro.length; $("n-office").textContent = cnt("office"); $("n-uni").textContent = cnt("uni"); $("n-mall").textContent = cnt("mall");
  $("tg-metro").onchange  = e => vis(["metro"], e.target.checked);
  [["office","tg-office"],["uni","tg-uni"],["mall","tg-mall"]].forEach(([k,id]) => $(id).onchange = e => { kindOn[k] = e.target.checked; updateKinds(); });
  map.on("idle", resolveHeights);
  $("tg-bound").onchange  = e => { boundOn = e.target.checked; syncLines(); };
  syncLines();   // 按默认状态显示街区边界
  // 地标
  PLACES.forEach(pl => { const b = document.createElement("button"); b.textContent = pl.name;
    b.onclick = () => {                                   // 先飞到地标,到位之后再让信息卡片从底部尖角处长出来
      const token = ++lmToken; if (lmPop) { lmPop.remove(); lmPop = null; }
      map.flyTo({center:pl.c,zoom:pl.z,pitch:pl.p,bearing:pl.b,duration:3500,essential:true});
      const flown = new Promise(res => map.once("moveend", res)), photo = landmarkPhoto(pl);   // 飞行和图片加载同时进行,都好了再显示卡片
      Promise.all([flown, photo]).then(([, img]) => { if (token !== lmToken) return;
        lmPop = popup(pl.c, (img ? `<div class="lm-media"><img class="lm-img" src="${img}" alt="${pl.name}"><div class="lm-h">${pl.name}</div></div>` : `<div class="pp-h">${pl.name}</div>`) + `<div class="lm-t">${pl.d}</div>`);
        lmPop.getElement().classList.add("lm-pop"); }); };
    $("places").appendChild(b); });
  // 平面 / 3D 切换:平面 = 建筑画成 2D 轮廓、彩色顶盖变成平面色块,并锁定俯仰角为 0(不能再倾斜)
  document.querySelectorAll("#view-toggle button").forEach(b => b.onclick = () => setViewMode(b.dataset.v === "flat"));

  // 咖啡店类型
  const counts = typeCounts(null);
  TYPES.forEach(t => { const l = document.createElement("label"); l.className = "opt";
    l.innerHTML = `<input type="checkbox" data-k="${t.k}"><span class="dot" style="background:${t.color}"></span>${t.label}<span class="cnt">${counts[t.k]||0}</span>`;
    l.querySelector("input").onchange = applyTypes; $("types").appendChild(l); });
  // 顶部「全选」是三态勾选框:全部选中 = 勾选;部分选中 = 半选(横杠);都没选 = 空。点击:没全选时 → 全选,已全选时 → 清空
  $("tg-all").onchange = e => setTypes(e.target.checked);
  syncAll();

  // 画范围:模式切换条 + 按状态变化的操作按钮 + 键盘(Esc 取消 / 回车完成)
  document.querySelectorAll("#draw-mode button").forEach(b => b.onclick = () => { if (b.dataset.m !== mode) setMode(b.dataset.m); });
  $("draw-actions").onclick = e => { const b = e.target.closest("button[data-a]"); if (b && !b.disabled) DRAW_ACTIONS[b.dataset.a](); };
  document.addEventListener("keydown", e => {
    if (!drawing || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "")) return;
    if (e.key === "Escape") { e.preventDefault(); cancelDrawing(); }
    else if (e.key === "Enter" && mode === "poly") { e.preventDefault(); finishPoly(); }
  });
  $("radius").oninput = e => { radius = +e.target.value; setRadiusFill(); $("radius-v").textContent = radius >= 1000 ? (radius/1000).toFixed(2).replace(/\.?0+$/,"")+" km" : radius+" m"; if (center) updateShape(); };
  setMode("block");

  // 评分权重:每个因子一张小卡(图标 + 名称 + 占比徽章 + 说明 + 自定义滑块),顶部分段条显示占比
  WEIGHTS.forEach(w => { const el = document.createElement("div"); el.className = "wrow"; el.id = "w-" + w.k; el.title = w.d; el.style.setProperty("--c", w.c);
    el.innerHTML = `<div class="whead"><span class="wdot"></span><span class="wname">${w.label}</span><span class="wpct">0%</span></div>` +
                   `<div class="wdesc">${w.d}</div><input class="wrange" type="range" min="0" max="100" value="${w.v}" aria-label="${w.label}">`;
    el.querySelector("input").oninput = e => { w.v = +e.target.value; renderWeights(); refreshScore(); };
    $("sliders").appendChild(el); });
  $("w-reset").onclick = () => { WEIGHTS.forEach(w => w.v = w.def); renderWeights(); refreshScore(); };
  renderWeights();
  $("radius").classList.add("wrange"); setRadiusFill();
}
function refreshScore() { if (activePopup) activePopup.remove(); map.getSource("nil").setData(nilGeoJSON()); renderTop3(); }
function renderWeights() {
  const sum = WEIGHTS.reduce((a,w) => a + w.v, 0);
  $("wbar").innerHTML = WEIGHTS.map(w => `<i style="flex:${w.v} 1 0;background:${w.c}" title="${w.label}"></i>`).join("");
  WEIGHTS.forEach(w => { const row = $("w-" + w.k), r = row.querySelector("input");
    row.querySelector(".wpct").textContent = (sum ? Math.round(w.v / sum * 100) : 0) + "%";   // 占比 = 该权重 / 全部权重之和(评分按占比计算)
    r.value = w.v; r.style.setProperty("--p", w.v + "%"); });
}
function setRadiusFill() { const r = $("radius"); r.style.setProperty("--p", (r.value - r.min) / (r.max - r.min) * 100 + "%"); }

let boundOn = true;   // 街区边界默认开启
function syncLines() { vis(["nil-line"], boundOn || shade !== "none"); }
function setShade(v) {
  shade = v; const on = v !== "none";
  if (on) resetShape();                                  // 开启着色 = 清空之前的统计选区(街区 / 多边形 / 圆形)和信息卡片
  vis(["nil-fill","nil-hit"], on); syncLines();
  vis(["nil-top","nil-label","nil-sel"], v === "score");
  if (activePopup) activePopup.remove(); setSelected(null);     // 换着色模式 = 退出点亮状态
  if (on) map.setPaintProperty("nil-fill","fill-color", v==="density" ? DENSITY_COLOR : SCORE_COLOR);
  $("score-box").style.display = v === "score" ? "block" : "none";
  $("top3-bar").style.display = v === "score" ? "flex" : "none"; document.body.classList.toggle("has-dock", v === "score");     // 前 3 名只在评分着色时显示在底部中间
  // 左侧(人口密度)和右侧(选址评分)是同一个着色状态的两个入口,二选一、互相同步
  if (typeof renderUI === "function" && map && map.getSource("circle")) renderUI();
  document.querySelectorAll("#shade-toggle button").forEach(b => { const on = b.dataset.s === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
  const lg = $("legend");
  if (on) { const g = GRADIENTS[v]; $("lg-title").textContent = g[0]; $("lg-bar").style.background = g[1]; $("lg-lo").textContent = g[2]; $("lg-hi").textContent = g[3]; lg.style.display = "block"; }
  else lg.style.display = "none";
}
function syncAll() {
  const boxes = [...document.querySelectorAll("#types input")], n = boxes.filter(i => i.checked).length, all = $("tg-all");
  all.checked = n === boxes.length && n > 0; all.indeterminate = n > 0 && n < boxes.length;
  $("n-sel").textContent = `${n} / ${boxes.length} selected`;
}
function applyTypes() {
  syncAll();
  const sel = [...document.querySelectorAll("#types input:checked")].map(i=>i.dataset.k);
  if (!sel.length) return vis(["cafes","cafes-pin"], false);
  const typeF = ["in",["get","type"],["literal",sel]];
  ["cafes","cafes-pin"].forEach(l => map.setFilter(l, selectedNil == null ? typeF : ["all", typeF, ["==", ["get","nil"], selectedNil]]));   // 点亮了区域:只显示该区域内的店
  vis(["cafes","cafes-pin"], true);
}
function setTypes(on) { document.querySelectorAll("#types input").forEach(i => i.checked = on); applyTypes(); }
function renderTop3() {
  const box = $("top3"); box.innerHTML = "";
  const wan = n => n >= 10000 ? (n/1000).toFixed(1).replace(/\.0$/,"") + "k" : n.toLocaleString();
  scored.slice(0,TOPN).forEach((r,i) => { const n = r.n, d = document.createElement("div"); d.className = "t3" + (n.id === selectedNil ? " sel" : "");
    d.dataset.id = n.id; d.setAttribute("role","button"); d.tabIndex = 0; d.setAttribute("aria-pressed", n.id === selectedNil ? "true" : "false");
    d.title = `${n.name}\nResidents ${n.residents.toLocaleString()} · Coffee shops ${n.cafes} · Metro stops ${n.metro} · ${n.dist} km from centre`;
    d.innerHTML = `<div class="h"><div class="rk">${i+1}</div><b>${n.name.split(" - ")[0]}</b></div>` +
                  `<div class="m"><div class="sc">${r.score}</div><span>${wan(n.residents)} residents<br>${n.cafes} coffee shops</span></div>`;
    const go = () => focusNil(n, { name:n.name, eligible:true, score:r.score, rank:i+1, residents:n.residents, density:Math.round(n.residents/n.area),
      cafes:n.cafes, metro:n.metro, offices:n.offices, unis:n.unis, malls:n.malls,
      sd:Math.round(r.sub.density*100), sc:Math.round(r.sub.comp*100), sf:Math.round(r.sub.flow*100), sr:Math.round(r.sub.rent*100) });   // 与直接点街区一样:先取景,再显示卡片
    d.onclick = go; d.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    box.appendChild(d); });
  const prev = document.querySelector(".t3-nav.prev"), next = document.querySelector(".t3-nav.next");      // 左右箭头 + 触控板横向滑动
  const upd = () => { prev.disabled = box.scrollLeft < 4; next.disabled = box.scrollLeft + box.clientWidth >= box.scrollWidth - 4; };
  prev.onclick = () => box.scrollBy({ left: -(box.clientWidth - 40) }); next.onclick = () => box.scrollBy({ left: box.clientWidth - 40 });
  box.onscroll = upd; upd(); requestAnimationFrame(upd);
}

Promise.all([fetch("milan-data.json").then(r=>r.json()), fetch("milan-footprints.json").then(r=>r.json()), fetch("milan-boundary.json").then(r=>r.json())]).then(([d, fp, bd]) => {
  DATA = d; DATA.ring = bd.ring;
  ensureGeom(); DATA.cafes.forEach(c => { const n = locateNil(c[0], c[1]); c[4] = n ? n.id : -1; });   // 每家店属于哪个街区(点亮区域后,右侧的咖啡店选项只作用于该区域)
  DATA.metro = DATA.metro.filter(a => pip(a[0], a[1], DATA.ring));   // 只保留米兰市内的地铁站
  prepFootprints(fp.f); init();
});
</script>
