<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DEF shade picker, clickable prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap">
<link rel="stylesheet" href="../def-mini-redesign/vendor/ds.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--ink);font:var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sheet{height:100%;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-3)}
.head{display:flex;justify-content:space-between;align-items:baseline}
.head h1{margin:0;font:var(--heading)}
.muted{color:var(--ink-muted);font:var(--caption)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--background);border-radius:var(--radius-pill)}
.seg button{height:36px;border-radius:var(--radius-pill);color:var(--ink-muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.entry{display:flex;gap:var(--space-2);margin:0}
.entry input{flex:1;min-width:0;height:44px;border:0;border-radius:var(--radius-pill);background:var(--background);padding:0 var(--space-4)}
.pill{height:44px;padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--ink);color:var(--surface)}
.chips{display:flex;gap:var(--space-2);overflow-x:auto;flex:none;scrollbar-width:none}
.chips button{flex:none;height:32px;padding:0 var(--space-3);border-radius:var(--radius-pill);background:var(--background);display:flex;align-items:center;gap:6px;font:var(--caption)}
.chips i{width:12px;height:12px;border-radius:50%}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.note{min-height:18px;margin:-4px 0;font:var(--caption);color:var(--ink-muted)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2);align-content:start;padding:8px 6px 4px}
.shade{display:flex;flex-direction:column;align-items:center;gap:2px;font:var(--caption)}
.sw{position:relative;width:100%;aspect-ratio:1;border-radius:var(--radius-sm)}
.shade[aria-pressed=true] .sw{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.qty{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:var(--surface);font:var(--caption);line-height:20px;text-align:center}
.before{position:absolute;left:5px;bottom:5px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/.25)}
.shade:disabled{cursor:default;color:var(--ink-muted)}
.shade:disabled .sw{opacity:.28}
.shade:disabled .sw:after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--ink);transform:rotate(-45deg)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-muted);padding:var(--space-5) 0}
.tray{flex:none;display:flex;flex-direction:column;gap:var(--space-2)}
.sum{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.link{height:32px;padding:0 var(--space-3);border-radius:var(--radius-pill);background:var(--background);font:var(--caption)}
.list{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-2)}
.row{display:flex;align-items:center;gap:var(--space-3)}
.row i{width:32px;height:32px;border-radius:var(--radius-sm);flex:none}
.row span{flex:1}
.step{display:flex;align-items:center;background:var(--background);border-radius:var(--radius-pill)}
.step button{width:36px;height:32px}
.step b{min-width:24px;text-align:center;font-weight:500}
.all{display:flex;align-items:center;gap:var(--space-2);font:var(--caption);color:var(--ink-muted)}
.add{height:52px;border-radius:var(--radius-pill);background:var(--ink);color:var(--surface);display:flex;justify-content:center;align-items:center}
.add:disabled{background:var(--background);color:var(--ink-muted);cursor:default}
</style>
</head>
<body>
<main class="sheet" id="app"></main>
<script>
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const pad=n=>String(n).padStart(2,'0');
/* 120 nail shades in eight colour families, generated for the demonstration */
const FAM=[['Nude',24,38,76],['Pink',342,58,72],['Red',354,72,40],['Coral',12,72,60],['Purple',282,34,48],['Blue',214,52,46],['Green',158,36,38],['Dark',330,22,18]];
const NAIL=range(1,120).map(n=>{const f=Math.floor((n-1)/15),k=(n-1)%15,[name,h,s,l]=FAM[f];
  return{code:pad(n),family:name,colour:`hsl(${(h+(k%5-2)*5+360)%360} ${s+(k%3-1)*8}% ${Math.max(8,Math.min(90,l+(7-k)*2.2))}%)`}});
/* 56 hair shades: depth level, then tone, the way the codes are written */
const TONE=[['0','Natural',28,30],['1','Ash',34,10],['3','Gold',40,55],['4','Copper',20,70],['5','Mahogany',352,45],['6','Red',2,70],['7','Brown',18,38]];
const HAIR=range(3,10).flatMap(level=>TONE.map(([t,name,h,s])=>({code:`${level}.${t}`,level:String(level),tone:name,colour:`hsl(${h} ${s}% ${8+level*6.4}%)`})));
const PRODUCT={
 nail:{title:'Gel Colour',shades:NAIL,price:7.9,bought:['05','09','12','23','48','61','101'],fresh:range(113,120).map(pad),out:['07','34','77','102'],hint:'Type numbers: 5 12 48'},
 hair:{title:'Colour Cream',shades:HAIR,price:6.4,bought:['4.0','5.0','6.0','6.3','7.1'],fresh:['8.1','9.1','10.1'],out:['5.6','9.4'],hint:'Type codes: 6.0 7.1'}};
const param=new URLSearchParams(location.search).get('s')||'';
const S={product:param==='hair'?'hair':'nail',view:'all',family:'All',level:'All',tone:'All',picked:new Map(),open:false,note:'',text:''};
const P=()=>PRODUCT[S.product];
const find=t=>P().shades.find(x=>S.product==='nail'?x.code===pad(Number(t)):x.code===(t.includes('.')?t:t+'.0'));
function addTyped(){
  const words=S.text.split(/[\s,;，、]+/).filter(Boolean);if(!words.length)return;
  const added=[],out=[],missing=[];
  for(const w of words){const x=find(w);if(!x)missing.push(w);else if(P().out.includes(x.code))out.push(x.code);else{S.picked.set(x.code,S.picked.get(x.code)||1);added.push(x.code)}}
  S.note=[added.length&&`Selected ${added.length}`,out.length&&`${out.join(', ')} sold out`,missing.length&&`${missing.join(', ')} not found`].filter(Boolean).join(' · ');
  S.text='';
}
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v)}n.append(...kids.filter(k=>k!==false&&k!=null));return n};
const chips=(key,options)=>el('div',{class:'chips',role:'group','aria-label':key},...options.map(([label,dot])=>el('button',{type:'button','aria-pressed':String(S[key]===label),onclick:()=>{S[key]=label;draw()}},dot?el('i',{style:`background:${dot}`}):false,key==='level'&&label!=='All'?`Level ${label}`:key==='tone'&&label==='All'?'All tones':label)));
function draw(){
  const old=document.querySelector('.grid'),top=old&&old.dataset.key===key()?old.scrollTop:0;
  const p=P();
  const shown=p.shades.filter(x=>(S.view==='all'||(S.view==='bought'?p.bought:p.fresh).includes(x.code))&&(S.product==='nail'?S.family==='All'||x.family===S.family:(S.level==='All'||x.level===S.level)&&(S.tone==='All'||x.tone===S.tone)));
  const pieces=[...S.picked.values()].reduce((a,b)=>a+b,0),n=S.picked.size;
  const input=el('input',{value:S.text,placeholder:p.hint,'aria-label':'Shade numbers',inputmode:'text',oninput:e=>{S.text=e.target.value}});
  const grid=el('div',{class:'grid','data-key':key()},...(shown.length?shown.map(x=>{const q=S.picked.get(x.code),out=p.out.includes(x.code);
    return el('button',{type:'button',class:'shade',disabled:out,'aria-pressed':String(!!q),'aria-label':`Shade ${x.code}${out?', sold out':''}`,onclick:()=>{q?S.picked.delete(x.code):S.picked.set(x.code,1);S.note='';draw()}},
      el('span',{class:'sw',style:`background:linear-gradient(145deg,rgb(255 255 255/.28),transparent 45%),${x.colour}`},p.bought.includes(x.code)?el('span',{class:'before',title:'Bought before'}):false,q?el('span',{class:'qty'},String(q)):false),x.code)}):[el('p',{class:'empty'},'No shades match these filters')]));
  const step=(code,d)=>()=>{const q=S.picked.get(code)+d;q>0?S.picked.set(code,q):S.picked.delete(code);if(!S.picked.size)S.open=false;draw()};
  const list=S.open&&n?[el('div',{class:'all'},'Set every shade to',...[1,3,6].map(v=>el('button',{type:'button',class:'link',onclick:()=>{for(const c of S.picked.keys())S.picked.set(c,v);draw()}},String(v)))),
    el('div',{class:'list'},...[...S.picked].map(([code,q])=>el('div',{class:'row'},el('i',{style:`background:${p.shades.find(x=>x.code===code).colour}`}),el('span',{},`Shade ${code}`),el('span',{class:'step',style:'flex:none'},el('button',{type:'button','aria-label':`One less of ${code}`,onclick:step(code,-1)},'−'),el('b',{},String(q)),el('button',{type:'button','aria-label':`One more of ${code}`,onclick:step(code,1)},'+')))))]:[];
  document.getElementById('app').replaceChildren(
    el('div',{class:'head'},el('h1',{},p.title),el('div',{class:'seg',style:'grid-template-columns:1fr 1fr;width:150px'},...[['nail','Gel'],['hair','Hair']].map(([id,label])=>el('button',{type:'button','aria-pressed':String(S.product===id),onclick:()=>{Object.assign(S,{product:id,view:'all',family:'All',level:'All',tone:'All',open:false,note:'',text:''});S.picked=new Map();draw()}},label)))),
    el('div',{class:'seg'},...[['all',`All ${p.shades.length}`],['bought',`Bought ${p.bought.length}`],['fresh',`New ${p.fresh.length}`]].map(([id,label])=>el('button',{type:'button','aria-pressed':String(S.view===id),onclick:()=>{S.view=id;draw()}},label))),
    el('form',{class:'entry',onsubmit:e=>{e.preventDefault();addTyped();draw()}},input,el('button',{type:'submit',class:'pill'},'Select')),
    ...(S.product==='nail'?[chips('family',[['All'],...FAM.map(([f,h,s,l])=>[f,`hsl(${h} ${s}% ${l}%)`])])]:[chips('level',[['All'],...range(3,10).map(v=>[String(v)])]),chips('tone',[['All'],...TONE.map(([,name,h,s])=>[name,`hsl(${h} ${s}% 45%)`])])]),
    el('p',{class:'note','aria-live':'polite'},S.note||`${shown.length} shades · dot means bought before`),
    grid,
    el('div',{class:'tray'},n?el('div',{class:'sum'},el('span',{},`${n} ${n>1?'shades':'shade'} · ${pieces} pcs`),el('button',{type:'button',class:'link','aria-expanded':String(S.open),onclick:()=>{S.open=!S.open;draw()}},S.open?'Done':'Quantities')):false,...list,
      el('button',{type:'button',class:'add',disabled:!n,onclick:()=>{S.note=`Added ${pieces} pcs to your bag`;S.picked=new Map();S.open=false;draw()}},n?`Add to Bag · €${(pieces*p.price).toFixed(2)}`:'Select shades')));
  grid.scrollTop=top;
}
function key(){return [S.product,S.view,S.family,S.level,S.tone].join('|')}
/* starting states used for the case study's screenshots */
if(param==='numbers'){S.text='5 12 48 101 7';addTyped()}
if(param==='bought'){S.view='bought';['05','12','48'].forEach(c=>S.picked.set(c,1))}
if(param==='tray'){['05','12','48','61'].forEach(c=>S.picked.set(c,1));S.picked.set('12',3);S.open=true}
if(param==='family'){S.family='Red';['32','38'].forEach(c=>S.picked.set(c,1))}
if(param==='hair'){S.level='6';['6.0','6.3'].forEach(c=>S.picked.set(c,1))}
draw();
</script>
</body>
</html>
