<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" fill="none" role="img" aria-labelledby="chatgpt-hybrid-title chatgpt-hybrid-desc">
  <title id="chatgpt-hybrid-title">ChatGPT Intelligent UI hybrid model</title>
  <desc id="chatgpt-hybrid-desc">My reverse-engineering interpretation describes a model that composes structured output, a client that validates and renders native components, and a sandbox fallback for novel content.</desc>
  <defs>
    <marker id="chatgpt-hybrid-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#777777" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="978" height="398" rx="10" fill="#FFFFFF" stroke="#D8D8D8"/>
  <text x="28" y="34" class="mono" fill="#0D7068" font-size="10" font-weight="600" letter-spacing="1">CHATGPT INTELLIGENT UI / A HYBRID DIRECTION</text>
  <text x="28" y="60" class="sans" fill="#555555" font-size="13">A system-level interpretation; this path does not represent every ChatGPT response.</text>
  <path d="M188 161H232" stroke="#777777" stroke-width="1.4" marker-end="url(#chatgpt-hybrid-arrow)"/>
  <path d="M414 161H458" stroke="#777777" stroke-width="1.4" marker-end="url(#chatgpt-hybrid-arrow)"/>
  <path d="M640 161H684" stroke="#0D9488" stroke-width="1.4" marker-end="url(#chatgpt-hybrid-arrow)"/>
  <rect x="28" y="104" width="160" height="114" rx="8" fill="#F3F1EA" stroke="#D8D5CC"/>
  <text x="46" y="130" class="mono" fill="#737373" font-size="9" letter-spacing="0.7">USER INTENT</text>
  <text x="46" y="164" class="sans" fill="#111111" font-size="16" font-weight="600">“Compare these</text>
  <text x="46" y="187" class="sans" fill="#111111" font-size="16" font-weight="600">options for me”</text>
  <rect x="232" y="104" width="182" height="114" rx="8" fill="#FFFFFF" stroke="#BDBDBD"/>
  <text x="250" y="130" class="mono" fill="#737373" font-size="9" letter-spacing="0.7">MODEL COMPOSES</text>
  <text x="250" y="164" class="sans" fill="#111111" font-size="16" font-weight="600">Structured view</text>
  <text x="250" y="188" class="sans" fill="#666666" font-size="12">Components + props</text>
  <rect x="458" y="104" width="182" height="114" rx="8" fill="#F5FBFA" stroke="#0D9488"/>
  <text x="476" y="130" class="mono" fill="#0D7068" font-size="9" letter-spacing="0.7">CLIENT CHECKS</text>
  <text x="476" y="164" class="sans" fill="#111111" font-size="16" font-weight="600">Validate + resolve</text>
  <text x="476" y="188" class="sans" fill="#666666" font-size="12">Approved component set</text>
  <rect x="684" y="104" width="268" height="114" rx="8" fill="#FFFFFF" stroke="#BDBDBD"/>
  <text x="702" y="130" class="mono" fill="#737373" font-size="9" letter-spacing="0.7">NATIVE UI RENDERS</text>
  <rect x="702" y="145" width="102" height="54" rx="6" fill="#F3F1EA"/>
  <text x="753" y="168" text-anchor="middle" class="sans" fill="#111111" font-size="12" font-weight="600">Summary</text>
  <text x="753" y="187" text-anchor="middle" class="sans" fill="#666666" font-size="10">Known view</text>
  <rect x="814" y="145" width="120" height="54" rx="6" fill="#E5F2F0"/>
  <text x="874" y="168" text-anchor="middle" class="sans" fill="#0D7068" font-size="12" font-weight="600">Comparison</text>
  <text x="874" y="187" text-anchor="middle" class="sans" fill="#666666" font-size="10">Product-styled</text>
  <path d="M323 218V274H402" stroke="#A0A0A0" stroke-width="1.3" marker-end="url(#chatgpt-hybrid-arrow)"/>
  <text x="339" y="252" class="mono" fill="#737373" font-size="8" letter-spacing="0.5">IF NO FIT</text>
  <rect x="402" y="266" width="350" height="86" rx="8" fill="#FFFFFF" stroke="#D3D3D3" stroke-dasharray="5 4"/>
  <text x="424" y="291" class="mono" fill="#737373" font-size="9" letter-spacing="0.7">FALLBACK FOR NOVEL CONTENT</text>
  <text x="424" y="320" class="sans" fill="#111111" font-size="15" font-weight="600">AppBlock / sandboxed content</text>
  <text x="424" y="339" class="sans" fill="#666666" font-size="11">More expressive, with a separate rendering boundary.</text>
</svg>
