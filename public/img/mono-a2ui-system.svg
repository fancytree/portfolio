<svg xmlns="http://www.w3.org/2000/svg" width="688" height="1060" viewBox="0 0 688 1060" fill="none" role="img" aria-labelledby="mono-a2ui-title mono-a2ui-desc">
  <title id="mono-a2ui-title">Mono A2UI system</title>
  <desc id="mono-a2ui-desc">A request is routed by the agent into an A2UI component specification. Mono validates the specification, resolves a product-owned React component, and presents a reviewable budget view.</desc>
  <defs>
    <marker id="mono-a2ui-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#6B6B6B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Boundary sits below connectors so the handoff remains visible across its edge. -->
  <rect x="44" y="700" width="600" height="352" rx="8" fill="#FFFFFF" fill-opacity="0.56" stroke="#BDBDBD" stroke-width="1"/>

  <!-- Connectors are behind the nodes. Each path uses only vertical/horizontal segments. -->
  <path d="M344 174V246" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#mono-a2ui-arrow)"/>
  <path d="M344 338V406" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#mono-a2ui-arrow)"/>
  <path d="M344 616V758H199Q191 758 191 766V784" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#mono-a2ui-arrow)"/>
  <path d="M304 830H384" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#mono-a2ui-arrow)"/>
  <path d="M497 876V892Q497 900 489 900H352Q344 900 344 908V916" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#mono-a2ui-arrow)"/>

  <!-- User request -->
  <rect x="120" y="86" width="448" height="88" rx="8" fill="#F2F7F5" stroke="#D6D3CC"/>
  <text x="144" y="113" class="mono" fill="#737373" font-size="10" letter-spacing="1.2">USER REQUEST</text>
  <text x="144" y="147" class="sans" fill="#0A0A0A" font-size="18" font-weight="500">“Show my spending this month”</text>

  <!-- Model routing -->
  <rect x="154" y="246" width="380" height="92" rx="6" fill="#FFFFFF" stroke="#BDBDBD"/>
  <rect x="174" y="262" width="52" height="18" rx="3" fill="#E9E9E9"/>
  <text x="200" y="275" text-anchor="middle" class="mono" fill="#555555" font-size="9" font-weight="600" letter-spacing="0.6">AGENT</text>
  <text x="174" y="303" class="sans" fill="#0A0A0A" font-size="17" font-weight="600">Route intent + retrieve data</text>
  <text x="174" y="322" class="mono" fill="#737373" font-size="10">QUERY_BUDGET · current financial facts</text>

  <!-- Focal handoff contract -->
  <rect x="60" y="406" width="568" height="210" rx="8" fill="#EAF5F2" stroke="#10A37F" stroke-width="1.5"/>
  <rect x="84" y="426" width="128" height="20" rx="3" fill="#DDF2EC"/>
  <text x="148" y="440" text-anchor="middle" class="mono" fill="#0D766E" font-size="9" font-weight="600" letter-spacing="0.8">DECLARATIVE HANDOFF</text>
  <text x="84" y="477" class="sans" fill="#0A0A0A" font-size="20" font-weight="600">A2UI component spec</text>
  <text x="84" y="498" class="sans" fill="#6B6B6B" font-size="12">The model composes a response from a supported vocabulary.</text>
  <line x1="84" y1="514" x2="604" y2="514" stroke="#B8DDD4"/>
  <text x="84" y="541" class="mono" fill="#737373" font-size="10">INTENT</text>
  <text x="84" y="560" class="sans" fill="#0A0A0A" font-size="13" font-weight="600">QUERY_BUDGET</text>
  <text x="356" y="541" class="mono" fill="#737373" font-size="10">COMPONENT</text>
  <text x="356" y="560" class="sans" fill="#0A0A0A" font-size="13" font-weight="600">BudgetStatusCard</text>
  <text x="84" y="584" class="mono" fill="#737373" font-size="10">DATA</text>
  <text x="84" y="602" class="sans" fill="#0A0A0A" font-size="12">Budget + spending totals</text>
  <text x="356" y="584" class="mono" fill="#737373" font-size="10">FEEDBACK</text>
  <text x="356" y="602" class="sans" fill="#0A0A0A" font-size="12">Answer or clarification</text>

  <!-- Client-owned runtime boundary -->
  <text x="68" y="732" class="mono" fill="#0A0A0A" font-size="10" font-weight="600" letter-spacing="1">MONO CLIENT</text>
  <text x="620" y="732" text-anchor="end" class="mono" fill="#737373" font-size="9" letter-spacing="0.6">PRODUCT-OWNED RUNTIME</text>

  <rect x="78" y="784" width="226" height="92" rx="6" fill="#FFFFFF" stroke="#BDBDBD"/>
  <text x="98" y="808" class="mono" fill="#737373" font-size="9" letter-spacing="0.8">01 / VALIDATE</text>
  <text x="98" y="835" class="sans" fill="#0A0A0A" font-size="16" font-weight="600">Check the schema</text>
  <text x="98" y="856" class="sans" fill="#737373" font-size="11">Reject unsupported shapes</text>

  <rect x="384" y="784" width="226" height="92" rx="6" fill="#FFFFFF" stroke="#BDBDBD"/>
  <text x="404" y="808" class="mono" fill="#737373" font-size="9" letter-spacing="0.8">02 / RESOLVE</text>
  <text x="404" y="835" class="sans" fill="#0A0A0A" font-size="16" font-weight="600">Use known components</text>
  <text x="404" y="856" class="sans" fill="#737373" font-size="11">Registry → product React views</text>

  <!-- Product-owned rendered view -->
  <rect x="128" y="916" width="432" height="112" rx="6" fill="#FFFFFF" stroke="#BDBDBD"/>
  <text x="148" y="939" class="mono" fill="#737373" font-size="9" letter-spacing="0.8">RENDERED VIEW</text>
  <text x="148" y="964" class="sans" fill="#0A0A0A" font-size="16" font-weight="600">BudgetStatusCard</text>
  <text x="148" y="990" class="sans" fill="#6B6B6B" font-size="12">Monthly budget</text>
  <text x="540" y="990" text-anchor="end" class="sans" fill="#0A0A0A" font-size="12" font-weight="600">€575 / €1,200</text>
  <rect x="148" y="1004" width="392" height="6" rx="3" fill="#E7E7E7"/>
  <rect x="148" y="1004" width="188" height="6" rx="3" fill="#10A37F"/>
  <circle cx="534" cy="938" r="4" fill="#10A37F"/>
  <text x="523" y="942" text-anchor="end" class="mono" fill="#737373" font-size="8">CLIENT STYLE + ACTIONS</text>
</svg>
