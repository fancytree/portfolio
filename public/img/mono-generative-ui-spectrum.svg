<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" fill="none" role="img" aria-labelledby="spectrum-title spectrum-desc">
  <title id="spectrum-title">Three generative UI patterns across platforms</title>
  <desc id="spectrum-desc">My comparison of controlled, declarative, and open-ended generative UI. Each path shows a prompt, what the model returns, how the client renders it, and platform examples mapped in my research.</desc>
  <defs>
    <marker id="spectrum-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#777777" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Pattern panels -->
  <rect x="16" y="16" width="368" height="420" rx="8" fill="#FFFFFF" stroke="#D3D3D3"/>
  <rect x="416" y="16" width="368" height="420" rx="8" fill="#F5FBFA" stroke="#0D9488" stroke-width="1.4"/>
  <rect x="816" y="16" width="368" height="420" rx="8" fill="#FFFFFF" stroke="#D3D3D3"/>

  <!-- Flow arrows, drawn before the nodes -->
  <path d="M124 159H147" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#spectrum-arrow)"/>
  <path d="M245 159H267" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#spectrum-arrow)"/>
  <path d="M524 159H547" stroke="#0D9488" stroke-width="1.3" marker-end="url(#spectrum-arrow)"/>
  <path d="M645 159H667" stroke="#0D9488" stroke-width="1.3" marker-end="url(#spectrum-arrow)"/>
  <path d="M924 159H947" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#spectrum-arrow)"/>
  <path d="M1045 159H1067" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#spectrum-arrow)"/>

  <!-- Controlled -->
  <text x="36" y="48" class="mono" fill="#737373" font-size="10" font-weight="600" letter-spacing="1">01 / CONTROLLED</text>
  <text x="36" y="72" class="sans" fill="#0A0A0A" font-size="17" font-weight="600">Select a prepared view</text>
  <text x="36" y="96" class="sans" fill="#737373" font-size="11">The model selects; the product defines the UI.</text>
  <text x="36" y="128" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">PROMPT</text>
  <text x="148" y="128" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">MODEL RETURNS</text>
  <text x="268" y="128" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">CLIENT RENDERS</text>
  <rect x="36" y="140" width="88" height="40" rx="5" fill="#F3F1EA" stroke="#D3D3D3"/>
  <text x="80" y="156" text-anchor="middle" class="sans" fill="#0A0A0A" font-size="9">Weather in</text>
  <text x="80" y="168" text-anchor="middle" class="sans" fill="#0A0A0A" font-size="9">New York?</text>
  <rect x="147" y="140" width="98" height="40" rx="5" fill="#FFFFFF" stroke="#D3D3D3"/>
  <text x="196" y="156" text-anchor="middle" class="mono" fill="#555555" font-size="8">view: weather</text>
  <text x="196" y="168" text-anchor="middle" class="mono" fill="#777777" font-size="8">+ forecast data</text>
  <rect x="268" y="136" width="96" height="50" rx="5" fill="#FFFFFF" stroke="#D3D3D3"/>
  <circle cx="346" cy="148" r="4" fill="#E5B647"/>
  <text x="278" y="151" class="mono" fill="#777777" font-size="7">NEW YORK</text>
  <text x="278" y="171" class="sans" fill="#0A0A0A" font-size="17" font-weight="600">18°</text>
  <text x="311" y="170" class="sans" fill="#737373" font-size="8">Clear</text>
  <line x1="36" y1="204" x2="364" y2="204" stroke="#E5E5E5"/>
  <text x="36" y="229" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">WHAT THE MODEL CAN CHANGE</text>
  <text x="36" y="249" class="sans" fill="#0A0A0A" font-size="11">Which prepared view to show, and its data.</text>
  <text x="36" y="283" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">PLATFORM EXAMPLES</text>
  <text x="36" y="304" class="sans" fill="#0A0A0A" font-size="11" font-weight="600">ChatGPT domain panels</text>
  <text x="36" y="322" class="sans" fill="#737373" font-size="10">Weather · stocks · sports · maps</text>
  <text x="36" y="366" class="sans" fill="#555555" font-size="10">Predictable and easy to validate;</text>
  <text x="36" y="382" class="sans" fill="#555555" font-size="10">limited to views designed in advance.</text>

  <!-- Declarative -->
  <text x="436" y="48" class="mono" fill="#0D7068" font-size="10" font-weight="600" letter-spacing="1">02 / DECLARATIVE</text>
  <text x="436" y="72" class="sans" fill="#0A0A0A" font-size="17" font-weight="600">Compose from known parts</text>
  <text x="436" y="96" class="sans" fill="#737373" font-size="11">The model describes; the client owns rendering.</text>
  <text x="436" y="128" class="mono" fill="#0D7068" font-size="8" letter-spacing="0.6">PROMPT</text>
  <text x="548" y="128" class="mono" fill="#0D7068" font-size="8" letter-spacing="0.6">MODEL RETURNS</text>
  <text x="668" y="128" class="mono" fill="#0D7068" font-size="8" letter-spacing="0.6">CLIENT RENDERS</text>
  <rect x="436" y="140" width="88" height="40" rx="5" fill="#FFFFFF" stroke="#B8DAD6"/>
  <text x="480" y="156" text-anchor="middle" class="sans" fill="#0A0A0A" font-size="9">Show my</text>
  <text x="480" y="168" text-anchor="middle" class="sans" fill="#0A0A0A" font-size="9">budget</text>
  <rect x="547" y="140" width="98" height="40" rx="5" fill="#FFFFFF" stroke="#0D9488"/>
  <text x="596" y="156" text-anchor="middle" class="mono" fill="#0D7068" font-size="8">component ID</text>
  <text x="596" y="168" text-anchor="middle" class="mono" fill="#777777" font-size="8">+ data / props</text>
  <rect x="668" y="136" width="96" height="50" rx="5" fill="#FFFFFF" stroke="#B8DAD6"/>
  <rect x="677" y="144" width="36" height="15" rx="3" fill="#E5F2F0"/>
  <rect x="718" y="144" width="36" height="15" rx="3" fill="#F1F1F1"/>
  <text x="695" y="154" text-anchor="middle" class="mono" fill="#0D7068" font-size="6">BUDGET</text>
  <text x="736" y="154" text-anchor="middle" class="mono" fill="#737373" font-size="6">RECORDS</text>
  <line x1="678" y1="168" x2="754" y2="168" stroke="#D8D8D8" stroke-width="3" stroke-linecap="round"/>
  <line x1="678" y1="168" x2="720" y2="168" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="436" y1="204" x2="764" y2="204" stroke="#D7E8E5"/>
  <text x="436" y="229" class="mono" fill="#0D7068" font-size="8" letter-spacing="0.6">WHAT THE MODEL CAN CHANGE</text>
  <text x="436" y="249" class="sans" fill="#0A0A0A" font-size="11">Known components, their order, and their data.</text>
  <text x="436" y="283" class="mono" fill="#0D7068" font-size="8" letter-spacing="0.6">PLATFORM EXAMPLES</text>
  <text x="436" y="304" class="sans" fill="#0A0A0A" font-size="11" font-weight="600">Google A2UI · Gemini Enterprise / Opal</text>
  <text x="436" y="322" class="sans" fill="#737373" font-size="10">Vercel json-render · Flutter GenUI SDK</text>
  <text x="436" y="366" class="sans" fill="#555555" font-size="10">Flexible combinations with product-owned</text>
  <text x="436" y="382" class="sans" fill="#555555" font-size="10">styles and behavior; bounded by the catalogue.</text>

  <!-- Open-ended -->
  <text x="836" y="48" class="mono" fill="#737373" font-size="10" font-weight="600" letter-spacing="1">03 / OPEN-ENDED</text>
  <text x="836" y="72" class="sans" fill="#0A0A0A" font-size="17" font-weight="600">Generate the interface</text>
  <text x="836" y="96" class="sans" fill="#737373" font-size="11">The model writes a complete, novel view.</text>
  <text x="836" y="128" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">PROMPT</text>
  <text x="948" y="128" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">MODEL RETURNS</text>
  <text x="1068" y="128" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">SANDBOX RENDERS</text>
  <rect x="836" y="140" width="88" height="40" rx="5" fill="#F3F1EA" stroke="#D3D3D3"/>
  <text x="880" y="156" text-anchor="middle" class="sans" fill="#0A0A0A" font-size="9">Build an</text>
  <text x="880" y="168" text-anchor="middle" class="sans" fill="#0A0A0A" font-size="9">interactive view</text>
  <rect x="947" y="140" width="98" height="40" rx="5" fill="#FFFFFF" stroke="#D3D3D3"/>
  <text x="996" y="156" text-anchor="middle" class="mono" fill="#555555" font-size="8">HTML + CSS</text>
  <text x="996" y="168" text-anchor="middle" class="mono" fill="#777777" font-size="8">+ interaction</text>
  <rect x="1068" y="136" width="96" height="50" rx="5" fill="#FFFFFF" stroke="#D3D3D3"/>
  <rect x="1074" y="142" width="84" height="8" rx="2" fill="#F0F0F0"/>
  <rect x="1078" y="155" width="31" height="25" rx="2" fill="#E8E2D7"/>
  <rect x="1115" y="155" width="40" height="4" rx="2" fill="#BDBDBD"/>
  <rect x="1115" y="164" width="36" height="4" rx="2" fill="#D3D3D3"/>
  <rect x="1115" y="173" width="27" height="5" rx="2" fill="#ED5B2B"/>
  <line x1="836" y1="204" x2="1164" y2="204" stroke="#E5E5E5"/>
  <text x="836" y="229" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">WHAT THE MODEL CAN CHANGE</text>
  <text x="836" y="249" class="sans" fill="#0A0A0A" font-size="11">Layout, content, and interaction logic.</text>
  <text x="836" y="283" class="mono" fill="#737373" font-size="8" letter-spacing="0.6">PLATFORM EXAMPLES</text>
  <text x="836" y="304" class="sans" fill="#0A0A0A" font-size="11" font-weight="600">Claude Artifacts</text>
  <text x="836" y="322" class="sans" fill="#737373" font-size="10">Gemini Dynamic View</text>
  <text x="836" y="366" class="sans" fill="#555555" font-size="10">Most expressive; hardest to predict for</text>
  <text x="836" y="382" class="sans" fill="#555555" font-size="10">quality, latency, safety, and consistency.</text>
</svg>
