      <line x1="706.054" y1="264" x2="650.710" y2="295.996" />
      <line x1="706.054" y1="456" x2="650.710" y2="424.004" />
      <line x1="540" y1="604" x2="540" y2="428" />
      <line x1="373.946" y1="456" x2="429.290" y2="424.004" />
      <line x1="373.946" y1="264" x2="429.290" y2="295.996" />
    </g>

