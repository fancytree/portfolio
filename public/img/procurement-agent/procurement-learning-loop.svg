      <text x="748" y="188" fill="#161616" font-size="12" font-weight="700">DDT</text>
      <text x="716" y="224" fill="#161616" font-size="24" font-weight="700">30</text>
      <text x="716" y="248" fill="#666666" font-size="12" font-weight="500">Shipment evidence</text>
