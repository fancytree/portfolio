<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1080 720" role="img" aria-labelledby="procurement-learning-loop-light-title procurement-learning-loop-light-desc" id="procurement-learning-loop-light-root">
    <title id="procurement-learning-loop-light-title">How the Agent grows from closed purchase outcomes</title>
    <desc id="procurement-learning-loop-light-desc">Supplier confirmation, DDT, receiving, variance, outcome and learning form a continuous loop that improves future procurement decisions.</desc>
