<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Walnut Coding research case study cover">
  <defs>
    <linearGradient id="wc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3D12"/>
      <stop offset="0.52" stop-color="#A4541E"/>
      <stop offset="1" stop-color="#C98A2B"/>
    </linearGradient>
  </defs>

  <rect width="640" height="220" fill="url(#wc-bg)"/>

  <!-- eyebrow -->
  <text x="40" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.4" fill="#F6E7CE" opacity="0.9">UX RESEARCH · EDTECH</text>

  <!-- title -->
  <text x="38" y="110" font-family="Nunito, system-ui, sans-serif" font-size="46" font-weight="800" fill="#FAF7F2">Walnut Coding</text>
  <text x="40" y="150" font-family="Nunito, system-ui, sans-serif" font-size="17" font-weight="400" fill="#F3E4CC">Post-trial parent decision-making</text>

  <!-- mini priority-bar motif -->
  <g transform="translate(40,170)">
    <rect x="0"   y="14" width="150" height="9" rx="4" fill="#FAF7F2" opacity="0.95"/>
    <rect x="0"   y="28" width="120" height="9" rx="4" fill="#F1D9A6" opacity="0.9"/>
    <rect x="0"   y="42" width="92"  height="9" rx="4" fill="#E9C892" opacity="0.85"/>
  </g>

  <!-- decision-node motif (right) -->
  <g transform="translate(486,44)" fill="none" stroke="#FAF7F2" stroke-opacity="0.85">
    <line x1="14" y1="14" x2="14" y2="120" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="14" cy="16"  r="7" fill="#3E6B5C" stroke-opacity="0"/>
    <circle cx="14" cy="50"  r="5" fill="#FAF7F2" stroke-opacity="0"/>
    <circle cx="14" cy="84"  r="5" fill="#FAF7F2" stroke-opacity="0"/>
    <circle cx="14" cy="118" r="8" fill="#FAF7F2" stroke-opacity="0"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FAF7F2" opacity="0.92">
    <text x="510" y="64">trial</text>
    <text x="510" y="98">evidence</text>
    <text x="510" y="132">…</text>
    <text x="510" y="166">pay</text>
  </g>

  <!-- focus frame -->
  <rect x="470" y="30" width="148" height="158" rx="12" fill="none" stroke="#FAF7F2" stroke-opacity="0.4" stroke-dasharray="5 5"/>
</svg>
